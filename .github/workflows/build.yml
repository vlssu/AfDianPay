name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Decode and set up Maven settings
        env:
          MAVEN_SETTINGS_BASE64: ${{ secrets.MAVEN_SETTINGS_BASE64 }}
        run: |
          if [ -n "$MAVEN_SETTINGS_BASE64" ]; then
            echo "$MAVEN_SETTINGS_BASE64" | base64 --decode > $HOME/.m2/settings.xml
          fi

      - name: Build and install dependencies from source
        env:
          HANDYLIB_VERSION: '3.31.5'
        run: |
          # Create temporary settings.xml with public repos needed to build handyplus libraries
          cat > /tmp/build-settings.xml << 'EOF'
          <settings>
            <profiles>
              <profile>
                <id>build-deps</id>
                <repositories>
                  <repository>
                    <id>spigotmc-repo</id>
                    <url>https://hub.spigotmc.org/nexus/content/repositories/snapshots/</url>
                  </repository>
                  <repository>
                    <id>papermc-repo</id>
                    <url>https://repo.papermc.io/repository/maven-public/</url>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>build-deps</activeProfile>
            </activeProfiles>
          </settings>
          EOF

          # Build and install FoliaLib from GitHub (only depends on folia-api from papermc)
          git clone --depth=1 https://github.com/handyplus/FoliaLib.git /tmp/FoliaLib
          cd /tmp/FoliaLib
          mvn --batch-mode install -Dmaven.test.skip=true -Dmaven.javadoc.skip=true -s /tmp/build-settings.xml

          # Build and install HandyLib from Gitee (depends on FoliaLib installed above)
          # Try tagged release first (with and without 'v' prefix), then fall back to HEAD
          git clone --depth=1 --branch "${HANDYLIB_VERSION}" https://gitee.com/handy-git/HandyLib.git /tmp/HandyLib 2>/dev/null || \
            git clone --depth=1 --branch "v${HANDYLIB_VERSION}" https://gitee.com/handy-git/HandyLib.git /tmp/HandyLib 2>/dev/null || \
            git clone --depth=1 https://gitee.com/handy-git/HandyLib.git /tmp/HandyLib
          cd /tmp/HandyLib
          mvn versions:set -DnewVersion="${HANDYLIB_VERSION}" -DgenerateBackupPoms=false -q
          mvn --batch-mode install -Dmaven.test.skip=true -Dmaven.javadoc.skip=true -s /tmp/build-settings.xml

      - name: Build with Maven
        run: mvn --batch-mode clean package

      - name: Extract artifact info
        id: artifact
        run: |
          ARTIFACT_ID=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          JAR_NAME="${ARTIFACT_ID}-${VERSION}.jar"
          JAR_PATH="target/${JAR_NAME}"
          echo "artifact_id=$ARTIFACT_ID" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "jar_name=$JAR_NAME" >> $GITHUB_OUTPUT
          echo "jar_path=$JAR_PATH" >> $GITHUB_OUTPUT

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact_id }} Artifacts
          path: ${{ steps.artifact.outputs.jar_path }}
          retention-days: 7
